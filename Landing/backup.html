.portal-button {
    --color1: #00ff99; /* Neon Green */
    --color2: #00bfff; /* Sky Blue */
    --color3: #003366; 
    width: 120px;
    height: 120px;
    position: fixed;
    bottom: 150px; /* Position it above the Rev Color button */
    right: 20px;
    overflow: hidden;
    border: none;
    cursor: pointer;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Kablammo", system-ui;
    font-optical-sizing: auto;
    font-weight: 4000;
    font-size: 25px;
    font-style: normal;
    color: black;
    text-align: center;
    z-index: 1000;
    animation: glow 2s infinite alternate;
}

/* Outer glow animation */
@keyframes glow {
    0% {
        filter: drop-shadow(0 0 15px rgba(0, 0, 255, 0.8));
    }
    100% {
        filter: drop-shadow(0 0 30px rgba(173, 0, 255, 0.9));
    }
}

/* Creating the swirling galaxy shape */
.portal-button::before {
    content: "";
    position: absolute;
    width: 110%;
    height: 110%;
    background: radial-gradient(circle, rgba(255, 255, 255, 1) 5%, var(--color1) 30%, var(--color2) 60%, var(--color3) 90%);
    clip-path: polygon(50% 0%, 65% 20%, 85% 30%, 100% 50%, 85% 70%, 65% 80%, 50% 100%, 35% 80%, 15% 70%, 0% 50%, 15% 30%, 35% 20%);
    filter: blur(5px);
    opacity: 0.9;
    animation: galaxySwirl 5s linear infinite;
}

/* Galaxy swirl animation */
@keyframes galaxySwirl {
    0% {
        transform: rotate(0deg) scale(1);
        opacity: 0.8;
    }
    50% {
        transform: rotate(180deg) scale(1.1);
        opacity: 1;
    }
    100% {
        transform: rotate(360deg) scale(1);
        opacity: 0.8;
    }
}
.portal-button::after {

    position: absolute;
    z-index: 10;
    color: white;

    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);}

        function copySphereStyles(element) {

    let shadowColor2 = shadowColors[1] || "N/A";

    let textContent = element.innerText || "N/A";
    let textcolors = rgbToHsl(computedStyle.color);
    // Format the copied text
    let copiedText = `${textContent}\n${textcolors}\n${bgColor}\n${shadowColor1}\n${shadowColor2}\n${borderColor}\n${computedStyle.boxShadow}`;

// Converts RGB to HSL
function rgbToHsl(rgbString) {
    if (!rgbString.includes("rgb")) return rgbString; // If already HSL or invalid, return as is

    let rgbValues = rgbString.match(/\d+/g).map(Number);
    let [r, g, b] = rgbValues.map(v => v / 255);

    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
        h = s = 0; // achromatic
    } else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
    }

    s = Math.round(s * 100);
    l = Math.round(l * 100);

    return `hsl(${h}, ${s}%, ${l}%)`;
}

// Extracts shadow colors from box-shadow
function extractShadowColors(boxShadow) {
    let colorMatches = boxShadow.match(/rgb\(\d+, \d+, \d+\)/g);
    if (!colorMatches) return ["N/A", "N/A"]; // Default if no shadows found

    return colorMatches.map(rgbToHsl);
}

        function playKndBeep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // First sound: Low-frequency "command pulse"
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = "square"; // Cold, electronic pulse
    osc1.frequency.setValueAtTime(180, ctx.currentTime); // Deep tactical tone
    gain1.gain.setValueAtTime(0.2, ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05); // Quick decay
    osc1.connect(gain1);
    gain1.connect(ctx.destination);

    // Second sound: High-frequency "data blip"
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = "sawtooth"; // Sharp and precise
    osc2.frequency.setValueAtTime(5000 + Math.random() * 30, ctx.currentTime); // Slight variation
    gain2.gain.setValueAtTime(0.15, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.002, ctx.currentTime + 0.05);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);

    // Introduce a very slight delay for a subtle echo effect
    const delay = ctx.createDelay();
    delay.delayTime.setValueAtTime(0.02, ctx.currentTime);
    gain2.connect(delay);
    delay.connect(ctx.destination);

    // Start and stop
    osc1.start();
    osc2.start();
    osc1.stop(ctx.currentTime + 0.06);
    osc2.stop(ctx.currentTime + 0.06);
}

function animateTextBoxLetters(textBox) {
    let text = textBox.innerText;
    textBox.innerHTML = ""; // Clear text box to insert spans

    let spans = text.split("").map((char) => {
        let span = document.createElement("span");
        span.innerText = char;
        span.style.display = "inline-block";
        span.style.transition = "transform 0.3s ease-in-out"; // Smooth transition
        textBox.appendChild(span);
        return span;
    });

    let i = 0;

    function animateLetters() {
        spans.forEach((span) => (span.style.transform = "scale(1)")); // Reset all
        function step() {
            if (i > 0) spans[i - 1].style.transform = "scale(1)"; // Reset previous
            spans[i].style.transform = "scale(3)"; // Enlarge current

            i = (i + 1) % spans.length; // Loop back to 0 after last letter
            setTimeout(step, 400); // Delay before next letter animates
        }
        step(); // Start animation loop
    }

    animateLetters();
}

// Modify shape click event to trigger letter animation
document.addEventListener("click", function (event) {
    if (event.target.classList.contains("textbox")) {
        animateTextBoxLetters(event.target);
    }
});
